<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Game - GameLab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light d-flex flex-column align-items-center">

  <div class="container text-center py-3">
    <h1 class="fw-bold">Memory Card Game</h1>
    <p class="text-warning">Cocokkan semua kartu sebelum waktunya habis!</p>
  </div>

  <!-- Info Bar -->
  <div class="info-bar d-flex justify-content-around align-items-center mb-3 w-100">
    <h5>Time: <span id="timer">80</span>s</h5>
    <h5>Score: <span id="score">0</span></h5>
    <a href="/index.html" class="btn btn-outline-light btn-sm">⬅ Back to Dashboard</a>
  </div>

  <!-- Game Board -->
  <div class="game-board" id="board"></div>

  <!-- Result Modal -->
  <div class="modal fade" id="resultModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light">
        <div class="modal-header">
          <h5 class="modal-title">Game Over</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <p id="resultMessage"></p>
        </div>
        <div class="modal-footer">
          <a href="index.html" class="btn btn-primary">Play Again</a>
          <a href="/index.html" class="btn btn-secondary">Back to Dashboard</a>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
