<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Poppins (general project) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- CSS General Project -->
  <link rel="stylesheet" href="/style.css">
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100">

  <div class="card shadow p-4 text-center" style="max-width: 360px; width: 100%;">
    <h2 class="fw-bold mb-2">Tic Tac Toe</h2>

    <p id="turn-indicator" class="mb-2 fw-semibold">
      Giliran: X
    </p>

    <p id="ttt-message" class="mb-3 text-success fw-semibold"></p>

    <!-- Game Grid -->
    <div class="grid-template mb-3">
      <button class="cell btn"></button>
      <button class="cell btn"></button>
      <button class="cell btn"></button>
      <button class="cell btn"></button>
      <button class="cell btn"></button>
      <button class="cell btn"></button>
      <button class="cell btn"></button>
      <button class="cell btn"></button>
      <button class="cell btn"></button>
    </div>

    <button id="ttt-reset" class="btn btn-outline-primary w-100">
      Muat Ulang
    </button>
  </div>

  <!-- Game Logic -->
  <script src="game.js"></script>
</body>
</html>
